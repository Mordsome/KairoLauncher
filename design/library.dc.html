<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kairo Launcher: Library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&amp;family=Pixelify+Sans:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0a1322}
a{color:inherit}a:hover{color:#ffffff}
.thumb-k{background-image:url(img/kairo-menu.jpg)}
.thumb-v{background-image:url(img/void-galaxy.jpg)}
.thumb-l{background-image:url(img/lite-village.jpg);filter:grayscale(.6) brightness(.7)}
.thumb-m{background-image:url(img/void-aurora.jpg);filter:grayscale(.6) brightness(.7)}
.row{transition:background-color .2s,border-color .2s}
.row:hover{background:rgba(255,255,255,.07)}
.railbtn:hover{background:rgba(255,255,255,.08)}
.ghost:hover{background:rgba(127,216,255,.14)}
</style>
</helmet>
<div style="position: relative; width: 1280px; height: 760px; overflow: hidden; font-family: 'Outfit', system-ui, sans-serif; color: #eaf4fb; background: radial-gradient(900px 500px at 75% 10%, #12233c 0%, #0a1322 60%)">
  <div style="position: absolute; left: 0; top: 0; right: 0; height: 36px; display: flex; align-items: center; padding-left: 92px; font-size: 13px; color: #b3c4d4">Kairo Launcher</div>

  <nav aria-label="Launcher" style="position: absolute; left: 0; top: 0; bottom: 0; width: 76px; display: flex; flex-direction: column; align-items: center; gap: 8px; padding-top: 18px; background: rgba(8,14,26,.78); border-right: 1px solid rgba(200,235,255,.2)">
    <svg width="34" height="34" viewBox="0 0 40 40" role="img" aria-label="Kairo" style="margin-bottom: 18px"><circle cx="20" cy="20" r="14" fill="none" stroke="#7fd8ff" stroke-width="4.5" stroke-dasharray="72 16" stroke-dashoffset="-52"></circle><path d="M14.5 7.6 A14 14 0 0 1 25.5 7.6" fill="none" stroke="#ff9a52" stroke-width="4" stroke-linecap="round"></path><circle cx="20" cy="20" r="5.6" fill="#7fd8ff"></circle></svg>
    <a href="home-and-picker.dc.html" class="railbtn" aria-label="Home" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #b3c4d4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><circle cx="12" cy="12" r="3"></circle></svg></a>
    <a href="library.dc.html" class="railbtn" aria-label="Library" aria-current="page" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; background: rgba(127,216,255,.14); color: #7fd8ff"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="4" width="16" height="6" rx="2"></rect><rect x="4" y="14" width="16" height="6" rx="2"></rect></svg></a>
    <a href="settings.dc.html" class="railbtn" aria-label="Settings" style="width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; color: #b3c4d4"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2.2"></circle><circle cx="8" cy="17" r="2.2"></circle></svg></a>
    <a href="sign-in.dc.html" aria-label="Account: Mordsome" style="margin-top: auto; margin-bottom: 18px; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center; background: #7fd8ff; color: #062033; font-weight: 700; text-decoration: none; font-size: 17px">M</a>
  </nav>

  <div style="position: absolute; left: 76px; top: 36px; right: 0; bottom: 0; display: flex; gap: 28px; padding: 28px 36px 32px 48px; box-sizing: border-box">
    <section style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; align-items: baseline; gap: 14px">
        <h1 style="margin: 0; font-size: 40px; font-weight: 700; letter-spacing: -0.02em">Library</h1>
        <span style="color: #b3c4d4; font-size: 16px">Each install keeps its own mods, worlds and settings.</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px">
        <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
          <button type="button" class="row" onClick="{{r.pick}}" disabled="{{r.disabled}}" aria-pressed="{{r.pressed}}" style="display: flex; align-items: center; gap: 18px; padding: 12px; border-radius: 16px; text-align: left; font: inherit; color: inherit; cursor: pointer; background: {{r.bg}}; border: 1px solid {{r.border}}; opacity: {{r.opacity}}">
            <span class="{{r.thumb}}" style="width: 150px; height: 84px; flex-shrink: 0; border-radius: 10px; background-size: cover; background-position: center"></span>
            <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
              <span style="display: flex; align-items: center; gap: 10px"><b style="font-size: 20px; font-weight: 600">{{r.name}}</b><span style="font-family: 'Pixelify Sans', 'Outfit', sans-serif; font-size: 13px; padding: 2px 8px; border-radius: 999px; background: rgba(255,255,255,.1)">{{r.mc}}</span></span>
              <span style="font-size: 15px; color: #b3c4d4">{{r.sub}}</span>
            </span>
            <span style="margin-left: auto; padding-right: 8px; font-size: 14px; color: {{r.stateColor}}">{{r.state}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <aside aria-label="Install details" style="width: 380px; flex-shrink: 0; border-radius: 22px; background: rgba(190,225,255,.07); border: 1px solid rgba(200,235,255,.2); padding: 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px">
      <div style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-family: 'Pixelify Sans', 'Outfit', sans-serif; font-size: 14px; color: #7fd8ff">Minecraft {{d.mc}}</span>
        <h2 style="margin: 0; font-size: 30px; font-weight: 700">{{d.name}}</h2>
        <span style="font-size: 15px; color: #b3c4d4">Last played {{d.last}}</span>
      </div>
      <div style="display: flex; flex-direction: column; gap: 8px">
        <span style="font-size: 14px; color: #b3c4d4">Installed for you</span>
        <sc-for list="{{d.mods}}" as="m" hint-placeholder-count="4">
          <div style="display: flex; justify-content: space-between; font-size: 15px; padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.05)"><span>{{m.n}}</span><span style="color: #b3c4d4">{{m.v}}</span></div>
        </sc-for>
      </div>
      <label style="display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 15px">
        <span>Keep Kairo updated<br><span style="font-size: 13px; color: #b3c4d4">Fabric API and Sodium update with it</span></span>
        <input type="checkbox" checked="{{auto}}" onChange="{{toggleAuto}}" style="width: 22px; height: 22px; accent-color: #7fd8ff">
      </label>
      <div style="margin-top: auto; display: flex; gap: 10px">
        <a href="home-and-picker.dc.html" style="flex: 1; min-height: 48px; border-radius: 999px; background: #7fd8ff; color: #062033; font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"></path></svg>Play</a>
        <button type="button" class="ghost" style="min-height: 48px; padding: 0 18px; border-radius: 999px; border: 1px solid rgba(200,235,255,.2); background: transparent; color: inherit; font: inherit; font-size: 15px; cursor: pointer">Open folder</button>
      </div>
    </aside>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":760}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { sel: 'kairo', auto: true }; }
  renderVals() {
    const data = [
      { id: 'kairo', name: 'Kairo', mc: '26.3', sub: 'Kairo 0.2.0 · Fabric · 38 hours played', thumb: 'thumb-k', ok: true, state: 'Up to date', last: 'today', mods: [{ n: 'Kairo', v: '0.2.0' }, { n: 'Fabric Loader', v: '0.17' }, { n: 'Fabric API', v: '0.165.0' }, { n: 'Sodium', v: '0.9.2' }] },
      { id: 'void', name: 'Kairo Void', mc: '26.3', sub: 'Kairo Void 0.2.0 · Fabric · 12 hours played', thumb: 'thumb-v', ok: true, state: 'Up to date', last: 'yesterday', mods: [{ n: 'Kairo Void', v: '0.2.0' }, { n: 'Fabric Loader', v: '0.17' }, { n: 'Fabric API', v: '0.165.0' }, { n: 'Sodium', v: '0.9.2' }] },
      { id: 'lite', name: 'Kairo Lite', mc: '1.8.9', sub: 'The Kairo look for classic PvP', thumb: 'thumb-l', ok: false, state: 'Coming soon' },
      { id: 'mid', name: 'Kairo', mc: '1.21.x', sub: 'For servers still on 1.21', thumb: 'thumb-m', ok: false, state: 'Later' }
    ];
    const rows = data.map((r) => {
      const sel = this.state.sel === r.id;
      return Object.assign({}, r, {
        pressed: String(sel), disabled: !r.ok,
        bg: sel ? 'rgba(127,216,255,.12)' : 'rgba(255,255,255,.03)',
        border: sel ? 'rgba(127,216,255,.55)' : 'rgba(200,235,255,.12)',
        opacity: r.ok ? 1 : 0.6,
        stateColor: r.ok ? '#5fe39b' : '#b3c4d4',
        pick: () => { if (r.ok) this.setState({ sel: r.id }); }
      });
    });
    const d = data.find((x) => x.id === this.state.sel);
    return { rows, d, auto: this.state.auto, toggleAuto: () => this.setState({ auto: !this.state.auto }) };
  }
}
</script>
</body>
</html>
