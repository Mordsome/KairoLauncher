# Builds the Windows installer and the Linux AppImage when a version tag (v1.2.3)
# is pushed, and attaches them to a DRAFT release. Nothing is public until the
# draft is checked and published by hand on GitHub. See docs/RELEASING.md.
#
# Security: the build jobs run hundreds of npm packages, so they can only read
# the repository and keep no token around. Only the last job, which runs no npm
# code at all, may write, and all it does is create the draft. Actions are pinned
# to exact commits, so a moved tag can't change what runs here.
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
            files: |
              release/*.exe
              release/*.blockmap
              release/latest.yml
          - os: ubuntu-latest
            target: --linux AppImage
            files: |
              release/*.AppImage
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26

      - run: npm ci

      - name: Tag matches package.json
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match package.json version $version"; exit 1
          fi

      - run: npm run test:unit

      # Typecheck, privacy check, build, and the check that no offline account is inside.
      - run: npm run build

      - name: Package (nothing is uploaded from here)
        run: npx electron-builder ${{ matrix.target }} --publish never

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.os }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          retention-days: 7

  draft:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --draft --title "${TAG#v}" \
            --notes "Draft: check the installers, paste the notes from CHANGELOG.md, then publish."
